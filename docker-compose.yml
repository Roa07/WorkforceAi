version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexhr_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hrms.db
      - JWT_SECRET_KEY=hrms-super-secret-jwt-key-takehome-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexhr_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
